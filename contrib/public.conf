# finalwisp --preset public: the settings for a server that anyone can reach.
# This file is built into the binary: `finalwisp --print-preset public` prints it.
# Order: this preset first, then a --config file, then the command line. The later one wins.
# Every line has an off value, given in its comment. `--preset none` drops the whole preset.

# Close the mail ports 25, 465 and 587. Off: no-block-smtp
block-smtp

# At most this many streams on one connection. Off: max-streams-per-conn 0
max-streams-per-conn 1024

# No new connections while 7/8 of the usable file descriptors are handed out. Open connections go on. Off: no-fd-admission
fd-admission

# From 3/4 of them, no new connections for one address that holds more than half while others hold a real share. Off: no-conn-share
conn-share

# Look up names with the built-in resolver, not the system's: a name that never answers is given up after 4 to 6 s,
# not after 10 s. It reads the name servers of /etc/resolv.conf, and /etc/hosts. Off: no-dns-own
dns-own

# Keep a quarter of the resolver threads for clients whose names answer fast. The other threads are shared: a free
# one goes to the client address with the fewest lookups running. Off: no-dns-reserve
dns-reserve

# While the host's TCP memory is short, no new streams for one address that holds more than half of the unread downloads. Off: no-tcpmem-share
tcpmem-share

# While the source ports toward one destination run short, no new streams to it for one address that holds more than half. Off: no-port-share
port-share

# No new connects to a destination that does not answer, but one probe per second. Off: no-dest-failfast
dest-failfast

# Counters and a log line for SYN retransmits and UDP datagrams. Nothing is refused. Off: no-net-watch
net-watch
