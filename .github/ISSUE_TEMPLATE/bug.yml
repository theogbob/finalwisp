name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to reproduce
      description: The finalwisp command line or config file (remove secrets), the client (wisp-js, epoxy, libcurl.js, ...) and the steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: finalwisp version
      description: The release (e.g. v1.0.0) or the `git:` line of BUILDINFO.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Linux distribution and kernel (`uname -r`), and what sits in front (nginx, Caddy, Cloudflare, none).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: finalwisp's stderr around the problem (the startup "capabilities" line helps).
      render: text
