name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to reproduce
      description: The finalwisp command line or config file (remove secrets), the client (wisp-js, epoxy, libcurl.js, ...) and the steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: finalwisp version
      description: The output of `finalwisp --version`. Before 1.3.0, the release (e.g. v1.2.1) or the `git:` line of BUILDINFO.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Settings in effect
      description: The output of `finalwisp YOUR-OPTIONS --show-config` (1.3.0 and later). It checks the options, prints every setting with the layer that set it and what the host allows, and starts nothing. It hides the user name and the password of an `--upstream` URL.
      render: text
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Linux distribution and kernel (`uname -r`), how it runs (systemd, Docker, a shell), and what sits in front (nginx, Caddy, Cloudflare, none).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: finalwisp's stderr around the problem, with the lines it prints at startup.
      render: text
